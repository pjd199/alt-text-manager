name: Release WordPress Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_SLUG: alt-text-manager

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Get Plugin Version
        id: get_version
        run: |
          VERSION=$(grep -m 1 "Version:" ${{ env.PLUGIN_SLUG }}.php | awk '{print $NF}' | tr -d '\r')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Install PHP Dependancies
        run: |
          composer install --no-dev --optimize-autoloader

      - name: Create Plugin ZIP
        run: |
          mkdir -p ${{ env.PLUGIN_SLUG }}
          
          # Copy your specific architecture folders
          cp ${{ env.PLUGIN_SLUG }}.php ${{ env.PLUGIN_SLUG }}/
          cp -r assets ${{ env.PLUGIN_SLUG }}/
          cp -r includes ${{ env.PLUGIN_SLUG }}/
          cp -r vendor ${{ env.PLUGIN_SLUG }}/
          cp uninstall.php ${{ env.PLUGIN_SLUG }}/
          cp readme.txt ${{ env.PLUGIN_SLUG }}/
          cp LICENSE ${{ env.PLUGIN_SLUG }}/

          zip -r ${{ env.PLUGIN_SLUG }}-${{ env.VERSION }}.zip ${{ env.PLUGIN_SLUG }}/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_SLUG }}-v${{ env.VERSION }}
          path: ${{ env.PLUGIN_SLUG }}-${{ env.VERSION }}.zip
          retention-days: 7
      
      - name: Check if release exists
        id: check_release
        run: |
          if gh release view v${{ env.VERSION }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v${{ env.VERSION }} already exists. Skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: ${{ env.PLUGIN_SLUG }}-${{ env.VERSION }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}